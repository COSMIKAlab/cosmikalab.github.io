
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090514">
<title>CÓSMIKA LAB · Wi-Fi</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #090514;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%,
      #7b35c955, transparent 35%),
    radial-gradient(circle at 90% 90%,
      #329bd933, transparent 30%);
  pointer-events: none;
}

.wrap {
  width: 100%;
  max-width: 520px;
  padding: 34px 20px;
  position: relative;
}

.logo {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 3px;
}

.sub {
  text-align: center;
  color: #aaa0ba;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 6px;
}

.card {
  margin-top: 28px;
  padding: 28px 20px;
  border: 1px solid #b77aff55;
  border-radius: 28px;
  background: #171024dd;
  text-align: center;
  box-shadow: 0 20px 60px #0008;
}

.icon { font-size: 42px; }

h1 {
  font-size: 29px;
  margin: 10px 0 8px;
}

.lead {
  color: #c9c1d3;
  line-height: 1.5;
  margin: 0 0 22px;
}

.qr {
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border-radius: 20px;
  padding: 14px;
  width: fit-content;
  max-width: 100%;
  margin: auto;
  min-height: 220px;
}

.qr img, .qr canvas {
  max-width: 100%;
  height: auto;
}

.network {
  margin-top: 22px;
  color: #988ba8;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.ssid {
  font-size: 22px;
  font-weight: 700;
  margin-top: 5px;
  word-break: break-word;
}

.note {
  margin-top: 18px;
  padding: 14px;
  border-radius: 15px;
  background: #ffffff0b;
  color: #c9c1d3;
  font-size: 13px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #766d82;
  font-size: 10px;
  letter-spacing: 1.5px;
  margin-top: 24px;
}
</style>
</head>

<body>
<main class="wrap">

  <div class="logo">CÓSMIKA LAB</div>
  <div class="sub">
    DISEÑO · TECNOLOGÍA · EXPERIENCIAS
  </div>

  <section class="card">
    <div class="icon">📶</div>

    <h1>Conéctate al Wi-Fi</h1>

    <p class="lead">
      Escanea este código QR con la cámara de tu teléfono
      y toca la opción para conectarte.
    </p>

    <div id="qrcode" class="qr"
         aria-label="Código QR para conectarse al Wi-Fi">
    </div>

    <div class="network">Red</div>
    <div class="ssid" id="networkName"></div>

    <div class="note">
      Si tu teléfono no muestra la opción automáticamente,
      abre <strong>Ajustes → Wi-Fi</strong> y selecciona esta red.
    </div>
  </section>

  <div class="footer">
    CÓSMIKA LAB · ACERCA · CONECTA · DESCUBRE
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const wifi = {
  ssid: "Totalplay-5G-C2C0",
  password: "GfbbcfcPazcJSE5d",
  security: "WPA"
};

document.getElementById("networkName").textContent = wifi.ssid;

const escapeWifi = value =>
  value.replace(/([\\;,:"])/g, "\\$1");

const wifiText =
  `WIFI:T:${wifi.security};S:${escapeWifi(wifi.ssid)};P:${escapeWifi(wifi.password)};;`;

const qrContainer = document.getElementById("qrcode");

if (window.QRCode) {
  new QRCode(qrContainer, {
    text: wifiText,
    width: 240,
    height: 240,
    colorDark: "#090514",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
} else {
  qrContainer.textContent =
    "No se pudo cargar el código QR. Recarga la página.";
}
</script>

</body>
</html>
